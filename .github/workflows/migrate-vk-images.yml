name: Перенос фото с VK на GitHub

on:
  push:
    branches: [main]
    paths:
      - "img/vk-src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-vk-images
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Pillow
        run: pip install pillow

      - name: Сжать фото и заменить ссылки
        run: python -u scripts/migrate_vk_images.py

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Фото с VK перенесены в img/vk, ссылки заменены"
            git pull --rebase
            git push
          fi
